  <!-- MAIN CONTENT -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Breadcrumb -->
  <text x="300" y="40" font-size="12" fill="white" opacity="0.3">← Back to runs</text>
  <text x="300" y="68" font-size="12" fill="white" opacity="0.3">Pages / Pipelines / Run detail</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- RUN HEADER — glass card -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="284" y="84" width="1080" height="100" rx="20" fill="url(#glassCard)" stroke="white" stroke-opacity="0.06"/>

  <text x="320" y="118" font-size="20" fill="white" font-weight="700">Pipeline run</text>
  <text x="320" y="140" font-size="12" fill="white" opacity="0.3" class="mono">a3f2c91b-4e7d-48a3-bf12-9c8e3a1d5f60</text>

  <!-- Status badge -->
  <rect x="1210" y="104" width="84" height="28" rx="14" fill="#097FC3" opacity="0.15"/>
  <circle cx="1226" cy="118" r="3" fill="#38BDF8"/>
  <text x="1235" y="122" font-size="12" fill="#38BDF8" font-weight="500">running</text>

