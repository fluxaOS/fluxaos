  <circle cx="37" cy="194" r="3.5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="37" y1="190" x2="37" y2="183" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="58" y="198" font-size="14" fill="white" font-weight="500">Pipelines</text>

  <text x="58" y="236" font-size="14" fill="white" opacity="0.4">KPIs</text>

  <text x="28" y="284" font-size="10" fill="white" opacity="0.2" font-weight="600" letter-spacing="1.8">SETTINGS</text>
  <text x="58" y="312" font-size="13" fill="white" opacity="0.35">Pipelines</text>
  <text x="58" y="340" font-size="13" fill="white" opacity="0.35">Personas</text>
  <text x="58" y="368" font-size="13" fill="white" opacity="0.35">Skills</text>
  <text x="58" y="396" font-size="13" fill="white" opacity="0.35">Routing</text>
  <text x="58" y="424" font-size="13" fill="white" opacity="0.35">Providers</text>

  <text x="28" y="938" font-size="11" fill="white" opacity="0.15" class="mono">v0.1.0-alpha</text>

