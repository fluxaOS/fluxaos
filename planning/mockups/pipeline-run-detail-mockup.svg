  <!-- ── STAGE 1: Research — COMPLETED ── -->
  <rect x="284" y="244" width="1080" height="90" rx="20" fill="url(#glassCard)" stroke="white" stroke-opacity="0.06"/>

  <!-- Step circle — green completed -->
  <circle cx="322" cy="280" r="18" fill="#188C42" opacity="0.15"/>
  <circle cx="322" cy="280" r="18" fill="none" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Checkmark -->
