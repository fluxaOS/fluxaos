  <circle cx="322" cy="516" r="18" fill="#7C3AED" opacity="0.2"/>
  <circle cx="322" cy="516" r="18" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="318" y="521" font-size="13" fill="#A78BFA" font-weight="700">3</text>

  <line x1="322" y1="650" x2="322" y2="678" stroke="white" stroke-opacity="0.08" stroke-width="2"/>

  <text x="356" y="514" font-size="15" fill="white" font-weight="600">Review</text>
  <rect x="424" y="500" width="104" height="24" rx="12" fill="#7C3AED" opacity="0.15"/>
  <circle cx="438" cy="512" r="3" fill="#A78BFA"/>
  <text x="447" y="516" font-size="11" fill="#A78BFA" font-weight="500">gate pending</text>

  <text x="356" y="538" font-size="12" fill="white" opacity="0.35">anthropic / claude-sonnet-4-6</text>

  <!-- Gate divider -->
  <line x1="304" y1="558" x2="1344" y2="558" stroke="white" stroke-opacity="0.06"/>

  <text x="320" y="584" font-size="12" fill="white" opacity="0.35" font-weight="500">Gate (rules) — awaiting review</text>

  <!-- Approve button — glass green -->
  <rect x="320" y="598" width="110" height="36" rx="12" fill="#22C55E" opacity="0.12" stroke="#22C55E" stroke-opacity="0.25"/>
  <polyline points="338,616 342,620 350,612" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="620" font-size="12" fill="#22C55E" font-weight="600">Approve</text>

  <!-- Rework button — glass amber -->
  <rect x="442" y="598" width="106" height="36" rx="12" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-opacity="0.2"/>
  <path d="M462,612 A5,5 0 1 1 468,618" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  <text x="476" y="620" font-size="12" fill="#FBBF24" font-weight="600">Rework</text>

  <!-- Abort button — glass red -->
