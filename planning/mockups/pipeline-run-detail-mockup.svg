<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <radialGradient id="orb1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B0014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0014" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150030" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0014" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="activeNav" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="activeStageGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
    <filter id="stageGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" fill="#0B0014"/>
  <rect width="1440" height="960" fill="url(#orb1)"/>
  <rect width="1440" height="960" fill="url(#orb2)"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- SIDEBAR -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="260" height="960" fill="url(#sidebarGrad)"/>
  <rect x="0" y="0" width="260" height="960" fill="white" opacity="0.03"/>
  <line x1="260" y1="0" x2="260" y2="960" stroke="white" stroke-opacity="0.06"/>

  <text x="28" y="48" font-size="20" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#A78BFA">flux</tspan><tspan fill="white">aOS</tspan>
  </text>
  <text x="28" y="66" font-size="11" fill="white" opacity="0.35">AI Orchestration OS</text>
  <line x1="20" y1="84" x2="240" y2="84" stroke="white" stroke-opacity="0.06"/>

  <!-- Nav items -->
  <rect x="30" y="106" width="7" height="7" rx="2" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="106" width="7" height="7" rx="2" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="30" y="116" width="7" height="7" rx="2" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="116" width="7" height="7" rx="2" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="58" y="119" font-size="14" fill="white" opacity="0.4">Dashboard</text>

  <circle cx="37" cy="155" r="6" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="58" y="159" font-size="14" fill="white" opacity="0.4">Issues</text>

  <!-- Active: Pipelines -->
