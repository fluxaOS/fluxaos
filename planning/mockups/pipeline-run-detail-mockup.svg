  <rect x="284" y="362" width="1080" height="90" rx="20" fill="url(#glassCard)" stroke="white" stroke-opacity="0.06"/>

  <circle cx="322" cy="398" r="18" fill="#188C42" opacity="0.15"/>
  <circle cx="322" cy="398" r="18" fill="none" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1.5"/>
  <polyline points="314,398 319,403 330,392" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="322" y1="452" x2="322" y2="480" stroke="white" stroke-opacity="0.08" stroke-width="2"/>

  <text x="356" y="392" font-size="15" fill="white" font-weight="600">Implement</text>
  <rect x="450" y="378" width="94" height="24" rx="12" fill="#188C42" opacity="0.12"/>
  <circle cx="464" cy="390" r="3" fill="#22C55E"/>
  <text x="473" y="394" font-size="11" fill="#22C55E" font-weight="500">completed</text>

  <text x="356" y="414" font-size="12" fill="white" opacity="0.35">anthropic / claude-opus-4-6</text>
  <text x="356" y="434" font-size="11" fill="white" opacity="0.2">8.4k tokens in · 3.2k tokens out · 12.1s</text>
  <text x="1320" y="398" font-size="14" fill="white" opacity="0.4" text-anchor="end" class="mono">$0.0081</text>

