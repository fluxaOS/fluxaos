  <line x1="576" y1="611" x2="584" y2="621" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="584" y1="611" x2="576" y2="621" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
  <text x="590" y="620" font-size="12" fill="#EF4444" font-weight="600">Abort</text>

  <!-- ── STAGE 4: Deploy — QUEUED (dimmed) ── -->
  <rect x="284" y="678" width="1080" height="72" rx="20" fill="url(#glassCard)" stroke="white" stroke-opacity="0.03" opacity="0.5"/>

  <circle cx="322" cy="714" r="18" fill="white" opacity="0.03"/>
  <circle cx="322" cy="714" r="18" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
  <text x="318" y="719" font-size="13" fill="white" opacity="0.2" font-weight="700">4</text>

  <text x="356" y="712" font-size="15" fill="white" opacity="0.25" font-weight="600">Deploy</text>
  <rect x="420" y="700" width="72" height="24" rx="12" fill="white" opacity="0.04"/>
  <circle cx="434" cy="712" r="3" fill="white" opacity="0.15"/>
  <text x="443" y="716" font-size="11" fill="white" opacity="0.2" font-weight="500">queued</text>

</svg>