# CI runs lint + type check only.
# Integration tests (vitest) require a real Supabase connection per project policy
# (no mocks, no Postgres service container) and are not run in CI. They are run
# locally pre-push and via Playwright journey tests in e2e/ which serve as the
# end-to-end verification gate. See FLX-57.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx biome check .

      - name: Type check
        run: npx tsc --noEmit
