<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <!-- Background atmospheric gradient -->
    <radialGradient id="bgOrb1" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgOrb2" cx="85%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0014" stop-opacity="0"/>
    </radialGradient>

    <!-- Sidebar gradient -->
    <linearGradient id="sidebarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0014"/>
    </linearGradient>

    <!-- Active nav pill -->
    <linearGradient id="navActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <!-- Just Do It card gradient -->
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="cardShadowLg" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- BACKGROUND — deep void with subtle violet atmosphere -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect width="1440" height="900" fill="#0B0014"/>
  <rect width="1440" height="900" fill="url(#bgOrb1)"/>
  <rect width="1440" height="900" fill="url(#bgOrb2)"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- SIDEBAR — Slate 900 solid, clean -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="250" height="900" fill="url(#sidebarBg)" filter="url(#cardShadow)"/>
  <line x1="250" y1="0" x2="250" y2="900" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="24" y="44" font-size="20" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#A78BFA">flux</tspan><tspan fill="white">aOS</tspan>
  </text>
  <text x="24" y="62" font-size="11" fill="#64748B">AI Orchestration OS</text>
  <line x1="16" y1="80" x2="234" y2="80" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Nav: Dashboard (ACTIVE — solid violet pill) -->
  <rect x="12" y="96" width="226" height="40" rx="10" fill="url(#navActive)" filter="url(#glowPurple)"/>
  <!-- Grid icon -->
  <rect x="26" y="108" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
  <rect x="36" y="108" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
  <rect x="26" y="118" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
  <rect x="36" y="118" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
  <text x="54" y="121" font-size="14" fill="white" font-weight="600">Dashboard</text>

  <!-- Nav: Issues -->
  <circle cx="33" cy="160" r="6" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="33" cy="160" r="2" fill="#64748B"/>
  <text x="54" y="164" font-size="14" fill="#94A3B8" font-weight="400">Issues</text>

  <!-- Nav: Pipelines -->
  <circle cx="33" cy="196" r="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="33" y1="192" x2="33" y2="185" stroke="#64748B" stroke-width="1.5"/>
  <path d="M39 185 L39 189 Q39 193 36 193" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="54" y="200" font-size="14" fill="#94A3B8" font-weight="400">Pipelines</text>

  <!-- Nav: KPIs -->
  <rect x="27" y="226" width="4" height="12" rx="1" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <rect x="33" y="222" width="4" height="16" rx="1" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <rect x="39" y="229" width="4" height="9" rx="1" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="54" y="236" font-size="14" fill="#94A3B8" font-weight="400">KPIs</text>

  <!-- Settings section -->
  <text x="24" y="286" font-size="10" fill="#475569" font-weight="600" letter-spacing="1.5">SETTINGS</text>
  <text x="54" y="312" font-size="13" fill="#64748B">Pipelines</text>
  <text x="54" y="338" font-size="13" fill="#64748B">Personas</text>
  <text x="54" y="364" font-size="13" fill="#64748B">Skills</text>
  <text x="54" y="390" font-size="13" fill="#64748B">Routing</text>
  <text x="54" y="416" font-size="13" fill="#64748B">Providers</text>

  <text x="24" y="878" font-size="11" fill="#334155" class="mono">v0.1.0-alpha</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MAIN CONTENT AREA -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Page header -->
  <text x="286" y="42" font-size="12" fill="#64748B">Pages / Dashboard</text>
  <text x="286" y="72" font-size="24" fill="white" font-weight="700">Dashboard</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- STAT CARDS — Slate 800 with real shadows, colored left border -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Card 1: Open Issues — violet left accent -->
  <rect x="274" y="94" width="254" height="96" rx="14" fill="#1E293B" filter="url(#cardShadow)"/>
  <rect x="274" y="94" width="5" height="96" rx="2" fill="#7C3AED"/>
  <text x="296" y="118" font-size="12" fill="#94A3B8" font-weight="500">Open issues</text>
  <text x="296" y="160" font-size="32" fill="white" font-weight="800">12</text>
  <text x="336" y="160" font-size="13" fill="#22C55E" font-weight="600">+3</text>
  <!-- Icon badge top-right -->
  <rect x="494" y="108" width="24" height="24" rx="6" fill="#7C3AED" opacity="0.15"/>
  <circle cx="506" cy="120" r="5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="506" cy="120" r="2" fill="#A78BFA"/>

  <!-- Card 2: In Progress — blue left accent -->
  <rect x="542" y="94" width="254" height="96" rx="14" fill="#1E293B" filter="url(#cardShadow)"/>
  <rect x="542" y="94" width="5" height="96" rx="2" fill="#097FC3"/>
  <text x="564" y="118" font-size="12" fill="#94A3B8" font-weight="500">In progress</text>
  <text x="564" y="160" font-size="32" fill="white" font-weight="800">3</text>
  <rect x="762" y="108" width="24" height="24" rx="6" fill="#097FC3" opacity="0.15"/>
  <path d="M774 114 A8 8 0 1 1 766 122" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

