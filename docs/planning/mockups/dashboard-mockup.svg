  <rect x="1224" y="296" width="16" height="44" rx="4" fill="#22C55E" opacity="0.6"/>
  <rect x="1248" y="284" width="16" height="56" rx="4" fill="#22C55E" opacity="0.7"/>
  <rect x="1272" y="310" width="16" height="30" rx="4" fill="#EF4444" opacity="0.5"/>
  <rect x="1296" y="290" width="16" height="50" rx="4" fill="#22C55E" opacity="0.65"/>

