  <text x="832" y="160" font-size="32" fill="white" font-weight="800">47</text>
  <text x="878" y="160" font-size="13" fill="#22C55E" font-weight="600">+8%</text>
  <rect x="1030" y="108" width="24" height="24" rx="6" fill="#188C42" opacity="0.15"/>
