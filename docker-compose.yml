services:
  fluxaos:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
